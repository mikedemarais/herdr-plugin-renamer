[package]
name = "herdr-plugin-renamer"
version = "0.2.1"
edition = "2021"
description = "Publishes human-readable coding-agent task titles in Herdr"
authors = ["Wyatt Johnson <wyattjoh@gmail.com>", "Mike Demarais"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/mikedemarais/herdr-plugin-renamer"
homepage = "https://github.com/mikedemarais/herdr-plugin-renamer"
keywords = ["herdr", "plugin", "agent", "title"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
libc = "0.2"

[profile.release]
lto = true
strip = true
